<!doctype html>
<html lang="fr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — Votre projet · Kōsō</title>
<meta name="description" content="Parlez-nous de votre projet : rénovation, construction, salle de bain, cuisine, terrasse ou demande d’échantillons. Rendez-vous au showroom Kōsō.">
<meta name="theme-color" content="#F2EEE7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231B1815'/%3E%3Crect x='19' y='19' width='7' height='7' fill='%23E2361B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<main id="main" tabindex="-1">
  <header class="page-hero">
    <div class="wrap">
      <p class="crumbs label"><a href="index.html">Kōsō</a><span aria-hidden="true">/</span><span>Contact</span></p>
      <div class="row">
        <h1 class="display h-1" data-split>Parlons de votre <em>projet</em><span class="sq" aria-hidden="true"></span></h1>
        <p class="lede rv">Quelques lignes suffisent. Nous revenons vers vous sous 48 h ouvrées pour fixer un rendez-vous ou préparer vos échantillons.</p>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="ct">
      <aside class="ct-aside">
        <div><p class="label label--muted" style="margin-bottom:12px">Showroom</p><p style="font-size:18px"><span data-site="address"></span><br><span data-site="city"></span></p></div>
        <div><p class="label label--muted" style="margin-bottom:12px">Téléphone</p><p style="font-size:18px" data-site="phone"></p></div>
        <div><p class="label label--muted" style="margin-bottom:12px">E-mail</p><p style="font-size:18px" data-site="email"></p></div>
        <div><p class="label label--muted" style="margin-bottom:12px">Horaires</p><div class="hours" data-site="hours"></div></div>
      </aside>
      <form class="form" id="form" novalidate>
        <div class="f f--full">
          <span class="flab" id="type-l">Votre projet <b aria-hidden="true">*</b></span>
          <div class="pills" role="group" aria-labelledby="type-l" id="types"></div>
          <p class="f-err" id="type-err" hidden></p>
        </div>
        <div class="f"><label for="name">Nom <b aria-hidden="true">*</b></label><input id="name" name="name" autocomplete="name" required aria-describedby="name-err"><p class="f-err" id="name-err" hidden></p></div>
        <div class="f"><label for="email">E-mail <b aria-hidden="true">*</b></label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-err"><p class="f-err" id="email-err" hidden></p></div>
        <div class="f"><label for="tel">Téléphone</label><input id="tel" name="tel" type="tel" autocomplete="tel" inputmode="tel"></div>
        <div class="f"><label for="ville">Ville du projet</label><input id="ville" name="ville" autocomplete="address-level2"></div>
        <div class="f f--full"><label for="budget">Budget indicatif</label>
          <select id="budget" name="budget"><option>À définir</option><option>Moins de 10 000 €</option><option>10 000 — 25 000 €</option><option>25 000 — 50 000 €</option><option>50 000 — 100 000 €</option><option>Plus de 100 000 €</option></select></div>
        <div class="f f--full" id="echantillons"><span class="flab">Échantillons sélectionnés</span>
          <div class="f-samples" id="samples"></div>
          <p class="f-help" id="samples-help"></p></div>
        <div class="f f--full"><label for="msg">Votre message</label><textarea id="msg" name="msg" placeholder="Surface, pièces concernées, délais, style recherché…"></textarea></div>
        <div class="form-foot">
          <label class="consent"><input type="checkbox" id="rgpd" required> <span>J'accepte que Kōsō utilise ces informations pour me recontacter au sujet de mon projet. <b style="color:var(--signal-ink);font-weight:500">*</b></span></label>
          <button class="btn btn--solid" type="submit">Envoyer la demande <span class="sq" aria-hidden="true"></span></button>
          <p class="f-err" id="rgpd-err" hidden style="width:100%"></p>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
